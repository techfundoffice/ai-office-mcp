[project]
name = "ai-office-mcp"
version = "0.1.0"
description = "MCP server that runs AI Office by CloudComputerAI from the Grok TUI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.29.1,<2",
    "windows-mcp @ git+https://github.com/CursorTouch/Windows-MCP.git@277db1bed9612fdfd242a50581f83ae981b07ff7",
]

[project.scripts]
ai-office-mcp = "ai_office_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
